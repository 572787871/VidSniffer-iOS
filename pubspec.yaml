name: ai_audiobook
description: AI Chinese audiobook reader with TXT import, chapter parsing, TTS playback, and iOS unsigned IPA build support.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audio_service: ^0.18.15
  dio: ^5.7.0
  file_picker: ^8.1.4
  just_audio: ^0.9.42
  path_provider: ^2.1.5
  shared_preferences: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

