workflows:
  unsigned-ios:
    name: Build native unsigned iOS IPA
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Build iOS without codesigning
        script: |
          set -euo pipefail
          xcodebuild \
            -project ios/Runner.xcodeproj \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios_xcode \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            build
      - name: Package unsigned IPA
        script: |
          set -euo pipefail
          APP_PATH="$(find build -path '*/Release-iphoneos/Runner.app' -type d | head -n 1)"
          IPA_DIR="build/ios/ipa"
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found under build/"
            exit 1
          fi
          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/Runner.app"
          cd "$IPA_DIR"
          zip -qry unsigned.ipa Payload
          test -f unsigned.ipa
    artifacts:
      - build/ios/ipa/unsigned.ipa
