name: Build VidSniffer Pro IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Install Flutter packages
        run: flutter pub get

      - name: Disable Flutter Swift Package Manager integration
        run: |
          flutter config --no-enable-swift-package-manager
          flutter config

      - name: Build iOS app without codesigning
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/ios/iphoneos/Runner.app"
          IPA_DIR="build/ios/ipa"
          IPA_PATH="$IPA_DIR/VidSniffer-Pro-unsigned.ipa"

          if [ ! -d "$APP_PATH" ]; then
            echo "Runner.app not found at $APP_PATH"
            exit 1
          fi

          rm -rf "$IPA_DIR"
          mkdir -p "$IPA_DIR/Payload"
          cp -R "$APP_PATH" "$IPA_DIR/Payload/Runner.app"
          (cd "$IPA_DIR" && zip -qry "$(basename "$IPA_PATH")" Payload)
          test -f "$IPA_PATH"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VidSniffer-Pro-unsigned-ipa
          path: build/ios/ipa/VidSniffer-Pro-unsigned.ipa
          if-no-files-found: error
