name: Build unsigned IPA

on:
  workflow_dispatch:
    inputs:
      scheme:
        description: "Xcode scheme to build"
        required: true
      configuration:
        description: "Build configuration"
        required: true
        default: "Release"
      project_path:
        description: "Optional .xcodeproj or .xcworkspace path"
        required: false

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PROJECT_PATH="${{ inputs.project_path }}"
          if [ -z "$PROJECT_PATH" ]; then
            PROJECT_PATH="$(find . -maxdepth 3 \( -name '*.xcworkspace' -o -name '*.xcodeproj' \) | head -n 1)"
          fi

          if [ -z "$PROJECT_PATH" ]; then
            echo "No .xcworkspace or .xcodeproj found."
            exit 1
          fi

          case "$PROJECT_PATH" in
            *.xcworkspace)
              echo "xcode_container=-workspace" >> "$GITHUB_OUTPUT"
              ;;
            *.xcodeproj)
              echo "xcode_container=-project" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "project_path must end with .xcworkspace or .xcodeproj"
              exit 1
              ;;
          esac

          echo "project_path=$PROJECT_PATH" >> "$GITHUB_OUTPUT"

      - name: Build app without signing
        shell: bash
        run: |
          set -euo pipefail

          DERIVED_DATA="$RUNNER_TEMP/DerivedData"

          xcodebuild \
            "${{ steps.project.outputs.xcode_container }}" "${{ steps.project.outputs.project_path }}" \
            -scheme "${{ inputs.scheme }}" \
            -configuration "${{ inputs.configuration }}" \
            -sdk iphoneos \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            clean build

          APP_PATH="$(find "$DERIVED_DATA/Build/Products/${{ inputs.configuration }}-iphoneos" -maxdepth 1 -name '*.app' | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "No .app was produced."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: unsigned.ipa
          if-no-files-found: error
