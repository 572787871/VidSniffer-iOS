name: Build VidSniffer Native IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: ios-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    name: Test and build unsigned iOS IPA
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Resolve Swift packages
        run: |
          set -o pipefail
          mkdir -p build/logs
          xcodebuild \
            -resolvePackageDependencies \
            -project ios/Runner.xcodeproj \
            -scheme Runner \
            2>&1 | tee build/logs/resolve-packages.log

      - name: Analyze native code
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Runner.xcodeproj \
            -scheme Runner \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            analyze \
            2>&1 | tee build/logs/analyze.log

      - name: Run unit tests
        run: |
          set -euo pipefail
          DEVICE_ID="$(
            xcrun simctl list devices available -j |
              ruby -rjson -e '
                data = JSON.parse(STDIN.read)["devices"]
                device = data.values.flatten.find {
                  |item| item["name"].start_with?("iPhone") &&
                    item["isAvailable"]
                }
                abort("No available iPhone simulator") unless device
                print device["udid"]
              '
          )"
          xcrun simctl boot "$DEVICE_ID" 2>/dev/null || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          TEST_LOG="build/logs/xcodebuild-tests.log"
          xcodebuild \
            -project ios/Runner.xcodeproj \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath build/TestDerivedData \
            -resultBundlePath build/TestResults.xcresult \
            -only-testing:RunnerTests \
            CODE_SIGNING_ALLOWED=NO \
            test \
            > >(tee "$TEST_LOG") 2>&1 &
          TEST_PID=$!
          (
            sleep 720
            if kill -0 "$TEST_PID" 2>/dev/null; then
              echo "Unit tests exceeded 12 minutes" | tee -a "$TEST_LOG"
              xcrun simctl diagnose > build/logs/simctl-diagnose.txt 2>&1 || true
              kill -TERM "$TEST_PID" 2>/dev/null || true
              sleep 10
              kill -KILL "$TEST_PID" 2>/dev/null || true
            fi
          ) &
          WATCHDOG_PID=$!
          set +e
          wait "$TEST_PID"
          TEST_STATUS=$?
          set -e
          kill "$WATCHDOG_PID" 2>/dev/null || true
          wait "$WATCHDOG_PID" 2>/dev/null || true
          exit "$TEST_STATUS"

      - name: Build unsigned iOS app
        run: |
          set -o pipefail
          xcodebuild \
            -project ios/Runner.xcodeproj \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build \
            2>&1 | tee build/logs/xcodebuild-release.log

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          IPA_ROOT="build/ipa"
          IPA_PATH="$IPA_ROOT/VidSniffer-Pro-unsigned.ipa"
          APP_PATH="build/DerivedData/Build/Products/Release-iphoneos/Runner.app"

          test -d "$APP_PATH"
          rm -rf "$IPA_ROOT"
          mkdir -p "$IPA_ROOT/Payload"
          cp -R "$APP_PATH" "$IPA_ROOT/Payload/Runner.app"
          find "$IPA_ROOT/Payload/Runner.app" \
            -type d -name _CodeSignature -prune -exec rm -rf {} +
          find "$IPA_ROOT/Payload/Runner.app" -name CodeResources -delete
          rm -f "$IPA_ROOT/Payload/Runner.app/embedded.mobileprovision"
          xattr -cr "$IPA_ROOT/Payload/Runner.app"
          (cd "$IPA_ROOT" && zip -qry "$(basename "$IPA_PATH")" Payload)
          unzip -tq "$IPA_PATH"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-ios-build-logs
          path: build/logs
          if-no-files-found: warn

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: VidSniffer-Pro-native-unsigned-ipa
          path: build/ipa/VidSniffer-Pro-unsigned.ipa
          if-no-files-found: error
